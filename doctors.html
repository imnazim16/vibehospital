<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a Doctor – VibeMed Hospital</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body data-nav="doctors">
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <nav aria-label="breadcrumb"><ol class="breadcrumb mb-2"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item active">Doctors</li></ol></nav>
      <h1>Find a Doctor</h1>
      <p class="lead mb-0">Search our team of experienced specialists.</p>
    </div>
  </section>

  <section class="section pt-0">
    <div class="container">
      <form id="doc-filter" class="form-card row g-3 align-items-end" style="margin-top:-40px;position:relative;z-index:2">
        <div class="col-lg-4 col-md-6">
          <label class="form-label" for="doc-search">Search Doctor</label>
          <input id="doc-search" type="text" class="form-control" placeholder="Doctor name or speciality...">
        </div>
        <div class="col-lg-3 col-md-6">
          <label class="form-label" for="doc-spec">Speciality</label>
          <select id="doc-spec" class="form-select"></select>
        </div>
        <div class="col-lg-3 col-md-6">
          <label class="form-label" for="doc-exp">Experience</label>
          <select id="doc-exp" class="form-select">
            <option value="">Any Experience</option>
            <option value="5">5+ Years</option>
            <option value="10">10+ Years</option>
            <option value="15">15+ Years</option>
          </select>
        </div>
        <div class="col-lg-2 col-md-6 d-grid">
          <button class="btn btn-primary" type="submit"><i class="ri-search-line me-1"></i> Search</button>
        </div>
      </form>

      <p id="doc-count" class="text-muted mt-4 mb-3"></p>
      <div class="row g-4" id="doctor-list"></div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
